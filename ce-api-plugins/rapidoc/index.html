<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ctrl-exec API</title>
  <!--
    Single-file RapiDoc interface for the ctrl-exec API. By default it loads the
    live spec from the same origin (/openapi-live.json); override with a query
    string, e.g.  index.html?spec=https://ctrl-exec.example:7445/openapi-live.json
    The RapiDoc library is loaded from a CDN; vendor it locally for offline use
    (see the README).
  -->
  <script type="module" src="https://unpkg.com/rapidoc/dist/rapidoc-min.js"></script>
  <style>html, body { margin: 0; height: 100%; }</style>
</head>
<body>
  <rapi-doc
    id="doc"
    heading-text="ctrl-exec API"
    render-style="read"
    theme="dark"
    show-header="true"
    allow-try="true"
    allow-spec-url-load="false"
    allow-spec-file-load="false"
    schema-style="table">
  </rapi-doc>

  <script>
    // Spec URL: ?spec=<url> if given, otherwise the same-origin live spec.
    var spec = new URLSearchParams(location.search).get('spec')
            || '/openapi-live.json';
    document.getElementById('doc').setAttribute('spec-url', spec);
  </script>
</body>
</html>
